<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered news verification and fake news detection system.">
    <meta property="og:title" content="Fake News Detection">
    <meta property="og:description" content="AI-powered news verification and fake news detection system.">
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>📰 Fake News Detection System</h1>
    <p class="subtitle">AI-powered news verification <span class="version-tag">v2.0.0</span></p>

    <textarea id="newsText" placeholder="Paste news here..."></textarea>
    
    <div class="sample-actions">
        <span class="sample-label">Try sample:</span>
        <button type="button" class="btn-sample" onclick="fillSample('real')">Real</button>
        <button type="button" class="btn-sample" onclick="fillSample('fake')">Fake</button>
        <button type="button" class="btn-sample" onclick="fillSample('uncertain')">Uncertain</button>
        <button type="button" class="btn-sample btn-clear" onclick="fillSample('clear')">Clear</button>
    </div>

    <button id="btnCheck" onclick="checkNews()">Check News</button>

    <div id="resultBox" class="hidden">
        <h2 id="prediction"></h2>

        <div class="confidence">
            <div class="bar">
                <div id="confidenceBar"></div>
            </div>
            <p id="confidenceText"></p>
        </div>

        <div class="explain">
            <h3>🧠 Explanation</h3>
            <p id="explainText">
                The model analyzes word frequency, sensational language,
                and linguistic patterns common in fake news.
            </p>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
